<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Clean, high-resolution dark background -->
  <rect width="512" height="512" rx="96" fill="#0A0A0A" />
  
  <!-- Group with styling to render crisp high-quality brand details -->
  <g transform="translate(10, 0)">
    <!-- High-res "HS" text path with clean kerning and font fallbacks -->
    <text x="75" y="335" font-family="'Barlow Condensed', 'Arial Black', sans-serif" font-weight="900" font-size="240" fill="#F5F0E8" letter-spacing="4">HS</text>
    
    <!-- Bold brand accent red star (*) -->
    <text x="345" y="335" font-family="'Barlow Condensed', 'Arial Black', sans-serif" font-weight="900" font-size="240" fill="#E8391D">*</text>
  </g>
</svg>